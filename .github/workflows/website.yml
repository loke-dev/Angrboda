name: Website

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'
  pull_request:
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
